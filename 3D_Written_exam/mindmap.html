<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>3D프린터운용기능사 필기 — 마인드맵</title>
<style>
:root{
  --bg:#13161c; --grid:#1c212a; --panel:#1b2029; --line:#39414f;
  --txt:#e9edf4; --dim:#98a2b3;
  --p1:#e7686b; --p2:#e89a3c; --p3:#d9c23f; --p4:#63c07a;
  --p5:#43b5c4; --p6:#5b8ff0; --p7:#9b7af0; --p8:#e070b8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid #7aa2ff;outline-offset:2px}

#stage{position:fixed;inset:0;cursor:grab;touch-action:none;
  background-image:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0);
  background-size:26px 26px}
#stage.drag{cursor:grabbing}
#svg{position:absolute;top:0;left:0;overflow:visible}

.lnk{fill:none;stroke-linecap:round}
.nd{cursor:pointer}
.nd rect{stroke-width:1.2}
.nd text{dominant-baseline:middle;paint-order:stroke}
.nd .cnt{font-size:9.5px;font-weight:700}
.nd.dimd{opacity:.2}
.lnk.dimd{opacity:.08}
.nd.hit rect{stroke:#ffd84d;stroke-width:2.4}

/* toolbar */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:6px;align-items:center;
  padding:9px 12px;background:linear-gradient(180deg,rgba(19,22,28,.96),rgba(19,22,28,.72) 70%,transparent);
  flex-wrap:wrap}
.ttl{font-size:12.5px;font-weight:700;letter-spacing:-.02em;margin-right:4px;white-space:nowrap}
.ttl span{color:var(--dim);font-weight:500}
.grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(27,32,41,.9)}
.grp button{padding:6px 10px;font-size:12px;color:var(--dim);border-right:1px solid var(--line)}
.grp button:last-child{border-right:none}
.grp button:hover{background:#252c37;color:var(--txt)}
.grp button.on{background:#333d4d;color:#fff}
#q{border:1px solid var(--line);border-radius:8px;background:rgba(27,32,41,.9);color:var(--txt);
  padding:6px 10px;font-size:12.5px;width:150px}
#q::placeholder{color:#6d7685}
.sp{flex:1}
#hits{font-size:11.5px;color:var(--dim);white-space:nowrap}

/* legend */
#leg{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:3px;
  background:rgba(27,32,41,.86);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  backdrop-filter:blur(6px)}
#leg .tog{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.04em;padding:1px 2px;text-align:left}
#leg div{display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:1px 0}
#leg div:hover{color:#fff}
#leg i{width:9px;height:9px;border-radius:2.5px;flex:0 0 auto}
#leg.min div{display:none}
#leg .tog{display:block!important}

/* zoom */
#zoom{position:fixed;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:9px;overflow:hidden;background:rgba(27,32,41,.9)}
#zoom button{width:34px;height:32px;font-size:15px;border-bottom:1px solid var(--line);color:var(--dim)}
#zoom button:last-child{border-bottom:none;font-size:11px}
#zoom button:hover{background:#252c37;color:#fff}

#tip{position:fixed;z-index:30;max-width:290px;background:#222935;border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;font-size:12.5px;line-height:1.55;display:none;
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#tip.on{display:block}
#tip b{display:block;font-size:10.5px;color:var(--dim);font-weight:600;margin-bottom:3px}

#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:19;
  font-size:11px;color:#6d7685;white-space:nowrap;pointer-events:none}
@media (max-width:760px){
  #bar{padding:7px 9px;gap:5px}
  .ttl span{display:none}
  #q{width:110px}
  #help{display:none}
  #leg{padding:6px 8px}
}
</style>
</head>
<body>

<div id="bar">
  <div class="ttl">마인드맵 <span>· 3D프린터운용기능사 필기</span></div>
  <div class="grp" id="depth">
    <button data-d="1">1단</button><button data-d="2" class="on">2단</button>
    <button data-d="3">3단</button><button data-d="99">전체</button>
  </div>
  <input id="q" type="search" placeholder="노드 검색" aria-label="검색">
  <span id="hits"></span>
  <div class="sp"></div>
  <div class="grp"><button id="fit">화면 맞춤</button></div>
</div>

<div id="stage"><svg id="svg"><g id="root"></g></svg></div>

<div id="leg"><button class="tog" id="legTog">PART ▾</button></div>
<div id="zoom">
  <button id="zin" aria-label="확대">+</button>
  <button id="zout" aria-label="축소">−</button>
  <button id="zreset">100%</button>
</div>
<div id="tip"></div>
<div id="help">한 번 누르면 접기·펼치기 · 두 번 누르면 가지 전체 · 왼쪽 아래 PART를 누르면 그 파트만 보기</div>

function fontFor(d){
  if(d===0) return '700 15px Pretendard, "Apple SD Gothic Neo", sans-serif';
  if(d===1) return '700 13.5px Pretendard, "Apple SD Gothic Neo", sans-serif';
  if(d===2) return '600 12.5px Pretendard, "Apple SD Gothic Neo", sans-serif';
  if(d===3) return '500 12px Pretendard, "Apple SD Gothic Neo", sans-serif';
  return '400 11.5px Pretendard, "Apple SD Gothic Neo", sans-serif';
}
var MAXC=[16,18,22,26,30,32,34];
function label(n){
  var lim=MAXC[Math.min(n.d,MAXC.length-1)];
  var t=n.t.replace(/\n/g,' ');
  return t.length>lim ? t.slice(0,lim-1)+'…' : t;
}
function width(n){
  meas.font=fontFor(n.d);
  var w=meas.measureText(label(n)).width + (n.d===0?34:24);
  if(n.c&&n.c.length) w+=16;
  return Math.max(w, n.d===0?120:56);
}
function height(n){ return n.d===0?46:(n.d===1?30:(n.d<=3?26:21)); }

/* ---------- layout (two-sided tidy tree) ---------- */
var VGAP=7, HGAP=30;
function vgap(n){ return n.d>=4?4:VGAP; }
function visible(n){ return n.open ? (n.c||[]) : []; }
function measure(n){
  var kids=visible(n);
  n.w=width(n); n.h=height(n);
  if(!kids.length){ n.sub=n.h+vgap(n); return n.sub; }
  var s=0; kids.forEach(function(k){ s+=measure(k); });
  n.sub=Math.max(s, n.h+vgap(n));
  return n.sub;
}
var nodes=[], links=[];
function place(n,x,yTop,side){
  n.y = yTop + n.sub/2;
  n.x = x;
  n.sd = side;
  nodes.push(n);
  var kids=visible(n); if(!kids.length) return;
  var cy=yTop + (n.sub - kids.reduce(function(a,k){return a+k.sub},0))/2;
  kids.forEach(function(k){
    var kx = side>0 ? x + n.w/2 + HGAP + k.w/2 : x - n.w/2 - HGAP - k.w/2;
    place(k,kx,cy,side);
    links.push({a:n,b:k,side:side,col:k.col,d:k.d});
    cy+=k.sub;
  });
}
function layout(){
  nodes=[]; links=[];
  DATA.w=width(DATA); DATA.h=height(DATA);
  var R=[],L=[];
  DATA.c.forEach(function(p){ (p.side>0?R:L).push(p); });
  [R,L].forEach(function(arr){ arr.forEach(measure); });
  var rTot=R.reduce(function(a,p){return a+p.sub},0);
  var lTot=L.reduce(function(a,p){return a+p.sub},0);
  var span=Math.max(rTot,lTot);
  DATA.x=0; DATA.y=0; nodes.push(DATA);
  var y=-rTot/2;
  R.forEach(function(p){
    var px = DATA.w/2 + HGAP + p.w/2;
    place(p,px,y,1); links.push({a:DATA,b:p,side:1,col:p.col,d:1}); y+=p.sub;
  });
  y=-lTot/2;
  L.forEach(function(p){
    var px = -DATA.w/2 - HGAP - p.w/2;
    place(p,px,y,-1); links.push({a:DATA,b:p,side:-1,col:p.col,d:1}); y+=p.sub;
  });
  return span;
}

/* ---------- render ---------- */
var g=document.getElementById('root'), svg=document.getElementById('svg');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  layout();
  var parts=[];
  links.forEach(function(L){
    var x1 = L.a.x + (L.side>0 ? L.a.w/2 : -L.a.w/2);
    var x2 = L.b.x - (L.side>0 ? L.b.w/2 : -L.b.w/2);
    var mx = (x1+x2)/2;
    var sw = L.d<=1 ? 2.6 : (L.d===2 ? 1.9 : 1.2);
    parts.push('<path class="lnk" data-n="'+L.b.id+'" d="M'+x1+','+L.a.y+
      ' C'+mx+','+L.a.y+' '+mx+','+L.b.y+' '+x2+','+L.b.y+
      '" stroke="'+L.col+'" stroke-width="'+sw+'" opacity="'+(L.d<=2?0.85:0.5)+'"/>');
  });
  nodes.forEach(function(n){
    var w=n.w,h=n.h,x=n.x-w/2,y=n.y-h/2;
    var kids=(n.c||[]).length;
    var fill, stroke, tcol, fs;
    if(n.d===0){ fill='#2a3140'; stroke='#66718a'; tcol='#fff'; }
    else if(n.d===1){ fill=n.col; stroke=n.col; tcol='#12151a'; }
    else if(n.d===2){ fill='rgba(255,255,255,.07)'; stroke=n.col; tcol='#eef2f8'; }
    else { fill='rgba(255,255,255,.03)'; stroke='rgba(255,255,255,.14)'; tcol='#c3cbd8'; }
    var r = n.d<=1?9:7;
    var s='<g class="nd" data-n="'+n.id+'">';
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+fill+'" stroke="'+stroke+'"/>';
    s+='<text x="'+n.x+'" y="'+(n.y+0.5)+'" text-anchor="middle" fill="'+tcol+
        '" style="font:'+fontFor(n.d)+'">'+esc(label(n))+'</text>';
    if(kids && n.d>0){
      var bx = n.sd>0 ? x+w+9 : x-9;
      s+='<circle cx="'+bx+'" cy="'+n.y+'" r="8" fill="#1b2029" stroke="'+(n.col==='#cfd6e2'?'#66718a':n.col)+'" stroke-width="1.3"/>';
      s+='<text class="cnt" x="'+bx+'" y="'+(n.y+0.5)+'" text-anchor="middle" fill="'+
          (n.open?'#8d97a8':(n.col==='#cfd6e2'?'#cfd6e2':n.col))+'">'+(n.open?'−':kids)+'</text>';
    }
    if(n.i){
      var ix = n.sd>0 ? x-7 : x+w+7;
      s+='<circle cx="'+ix+'" cy="'+(n.y-h/2+7)+'" r="4.5" fill="#f0b429"/>';
    }
    s+='</g>';
    parts.push(s);
  });
  g.innerHTML=parts.join('');
  applyFilter();
}

/* ---------- pan & zoom ---------- */
var tx=0,ty=0,sc=1;
function apply(){ g.setAttribute('transform','translate('+tx+','+ty+') scale('+sc+')'); }
function fit(list){
  var src = (list && list.length) ? list : nodes;
  var xs=[],ys=[];
  src.forEach(function(n){xs.push(n.x-n.w/2,n.x+n.w/2);ys.push(n.y-n.h/2,n.y+n.h/2)});
  var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  var W=innerWidth-40, H=innerHeight-110;
  sc=Math.min(W/(maxX-minX+80), H/(maxY-minY+80), 1.6);
  sc=Math.max(sc,0.3);
  tx=innerWidth/2 - ((minX+maxX)/2)*sc;
  ty=(innerHeight/2+22) - ((minY+maxY)/2)*sc;
  apply();
}
var stage=document.getElementById('stage');
var dragging=false,sx,sy,moved=0;
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('#bar,#zoom,#leg')) return;
  dragging=true;moved=0;sx=e.clientX-tx;sy=e.clientY-ty;
  stage.classList.add('drag');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var nx=e.clientX-sx,ny=e.clientY-sy;
  moved+=Math.abs(nx-tx)+Math.abs(ny-ty); tx=nx;ty=ny;apply();
});
stage.addEventListener('pointerup',function(e){dragging=false;stage.classList.remove('drag')});
stage.addEventListener('pointercancel',function(){dragging=false;stage.classList.remove('drag')});
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  var k=Math.exp(-e.deltaY*0.0016), ns=Math.min(3,Math.max(0.06,sc*k));
  tx=e.clientX-(e.clientX-tx)*(ns/sc); ty=e.clientY-(e.clientY-ty)*(ns/sc); sc=ns; apply();
},{passive:false});
/* pinch */
var pts={},pd=0;
stage.addEventListener('pointerdown',function(e){pts[e.pointerId]=[e.clientX,e.clientY]});
stage.addEventListener('pointermove',function(e){
  if(!(e.pointerId in pts))return; pts[e.pointerId]=[e.clientX,e.clientY];
  var k=Object.keys(pts); if(k.length!==2)return;
  dragging=false;
  var a=pts[k[0]],b=pts[k[1]];
  var d=Math.hypot(a[0]-b[0],a[1]-b[1]), cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2;
  if(pd){ var ns=Math.min(3,Math.max(0.06,sc*d/pd));
    tx=cx-(cx-tx)*(ns/sc); ty=cy-(cy-ty)*(ns/sc); sc=ns; apply(); }
  pd=d;
});
['pointerup','pointercancel'].forEach(function(ev){
  stage.addEventListener(ev,function(e){delete pts[e.pointerId];pd=0});
});
document.getElementById('zin').onclick=function(){zoomBy(1.25)};
document.getElementById('zout').onclick=function(){zoomBy(0.8)};
document.getElementById('zreset').onclick=function(){var k=1/sc;zoomBy(k)};
function zoomBy(k){
  var ns=Math.min(3,Math.max(0.06,sc*k)), cx=innerWidth/2, cy=innerHeight/2;
  tx=cx-(cx-tx)*(ns/sc); ty=cy-(cy-ty)*(ns/sc); sc=ns; apply();
}
document.getElementById('fit').onclick=function(){fit()};

/* ---------- interaction ---------- */
var byId={};
(function idx(n){byId[n.id]=n;(n.c||[]).forEach(idx)})(DATA);

g.addEventListener('click',function(e){
  if(moved>6) return;
  var el=e.target.closest('.nd'); if(!el) return;
  var n=byId[+el.dataset.n]; if(!n) return;
  if(n.c&&n.c.length){ n.open=!n.open; render(); }
  else { showTip(e, n); }
});
g.addEventListener('dblclick',function(e){
  var el=e.target.closest('.nd'); if(!el)return;
  var n=byId[+el.dataset.n]; if(!n)return;
  if(n.c&&n.c.length){
    var target=!n.open || (n.c||[]).some(function(k){return k.c&&k.c.length&&!k.open});
    (function walk(x){ x.open=target; (x.c||[]).forEach(walk); })(n);
    render();
  } else showTip(e,n);
});
var tip=document.getElementById('tip');
function showTip(e,n){
  tip.innerHTML='<b>'+(n.d===0?'중심':'깊이 '+n.d)+(n.i?' · 노트 캡처 '+n.i+'장':'')+'</b>'+esc(n.t);
  tip.classList.add('on');
  var x=Math.min(e.clientX+12, innerWidth-300), y=Math.min(e.clientY+12, innerHeight-90);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
stage.addEventListener('pointerdown',function(e){ if(!e.target.closest('.nd')) tip.classList.remove('on'); });

/* depth buttons */
function setDepth(d){
  (function walk(n){ n.open = n.d < d; (n.c||[]).forEach(walk); })(DATA);
  DATA.open=true; render(); fit();
}
document.querySelectorAll('#depth button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#depth button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on'); setDepth(+b.dataset.d);
  };
});

/* legend */
var leg=document.getElementById('leg');
var narrow = window.matchMedia('(max-width:760px)').matches;
if(narrow) leg.classList.add('min');
document.getElementById('legTog').onclick=function(e){
  e.stopPropagation(); leg.classList.toggle('min');
  this.textContent = leg.classList.contains('min') ? 'PART ▸' : 'PART ▾';
};
document.getElementById('legTog').textContent = narrow ? 'PART ▸' : 'PART ▾';
DATA.c.forEach(function(p,i){
  var d=document.createElement('div');
  d.innerHTML='<i style="background:'+COLORS[i]+'"></i>'+p.t;
  d.onclick=function(){
    // 이 파트만 전부 펼치고 나머지는 접기
    DATA.c.forEach(function(o){
      (function walk(n,open){ n.open=open; (n.c||[]).forEach(function(k){walk(k,open)}); })(o, o===p);
      o.open = (o===p);
    });
    DATA.open=true;
    document.querySelectorAll('#depth button').forEach(function(x){x.classList.remove('on')});
    render(); fit();
  };
  leg.appendChild(d);
});
function focusNode(n){
  var t=nodes.filter(function(x){return x.id===n.id})[0]; if(!t)return;
  tx=innerWidth/2-t.x*sc; ty=innerHeight/2-t.y*sc; apply();
}

/* search */
var q=document.getElementById('q'), hits=document.getElementById('hits'), timer;
q.addEventListener('input',function(){clearTimeout(timer);var v=this.value.trim();timer=setTimeout(function(){search(v)},180)});
var matched=null;
function search(v){
  if(!v){ matched=null; hits.textContent=''; render(); return; }
  var low=v.toLowerCase(); matched={}; var cnt=0;
  (function walk(n,path){
    var p=path.concat([n]);
    if(n.t.toLowerCase().indexOf(low)>=0){ cnt++; p.forEach(function(a){matched[a.id]=(a===n)?2:1}); 
      path.forEach(function(a){a.open=true}); }
    (n.c||[]).forEach(function(k){walk(k,p)});
  })(DATA,[]);
  hits.textContent = cnt? cnt+'개' : '없음';
  render();
  if(cnt){
    var hitNodes = nodes.filter(function(n){return matched[n.id]===2});
    if(hitNodes.length) fit(hitNodes);
  }
}
function applyFilter(){
  if(!matched) return;
  g.querySelectorAll('.nd').forEach(function(el){
    var m=matched[+el.dataset.n];
    if(!m) el.classList.add('dimd'); else if(m===2) el.classList.add('hit');
  });
  g.querySelectorAll('.lnk').forEach(function(el){
    if(!matched[+el.dataset.n]) el.classList.add('dimd');
  });
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='/'){e.preventDefault();q.focus()}
  if(e.key==='0'){fit()}
  if(e.key==='Escape'){tip.classList.remove('on')}
  if(e.key>='1'&&e.key<='4'){ document.querySelectorAll('#depth button')[+e.key-1].click(); }
});

function sizeSvg(){ svg.setAttribute('width',innerWidth); svg.setAttribute('height',innerHeight); }
addEventListener('resize',function(){sizeSvg()});
sizeSvg();
if(narrow){
  document.querySelectorAll('#depth button').forEach(function(x){x.classList.remove('on')});
  document.querySelector("#depth button[data-d='1']").classList.add('on');
  setDepth(1);
} else { render(); fit(); }
</script>
</body>
